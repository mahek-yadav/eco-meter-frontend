[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # These VITE_* values are public client-side config (Firebase web config,
  # VAPID public key, API/socket URLs) and are intentionally inlined into the
  # browser bundle by Vite, so secrets scanning should not flag them.
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_URL,VITE_SOCKET_URL,VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_VAPID_KEY"
